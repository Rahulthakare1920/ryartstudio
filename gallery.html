<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gallery | Ryart Creation String Art Portfolio</title>

<meta name="description" content="Explore the handmade string art gallery of Rahul Thakare. View custom portraits, wall décor, artistic installations, and creative thread art projects by Ryart Creation.">

<meta name="keywords" content="String Art Gallery, Ryart Creation Gallery, Rahul Thakare Portfolio, Handmade Thread Art, Custom Wall Art">

<meta name="author" content="Rahul Thakare">

<meta name="robots" content="index, follow">

<link rel="stylesheet" href="css/style.css">

<link rel="icon" type="image/png" href="images/favicon.png">

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
}

.gallery-header{
    background:#111;
    color:white;
    padding:25px;
    text-align:center;
}

.gallery-header h1{
    margin:0;
    font-size:40px;
}

.gallery-header p{
    color:#ddd;
}

.back-btn{
    display:inline-block;
    margin-top:15px;
    color:white;
    text-decoration:none;
    border:1px solid white;
    padding:10px 20px;
    border-radius:30px;
    transition:.3s;
}

.back-btn:hover{
    background:white;
    color:black;
}

.gallery-grid{

    width:90%;
    margin:50px auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

    gap:25px;

}

.gallery-grid img{

    width:100%;
    height:300px;

    object-fit:cover;

    border-radius:12px;

    cursor:pointer;

    transition:.4s;

    box-shadow:0 5px 15px rgba(0,0,0,.2);

}

.gallery-grid img:hover{

    transform:scale(1.05);

}

.lightbox{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.9);

    justify-content:center;

    align-items:center;

    z-index:999;

}

.lightbox img{

    max-width:90%;
    max-height:90%;

    border-radius:10px;

}

.close{

    position:absolute;

    top:20px;
    right:35px;

    font-size:45px;

    color:white;

    cursor:pointer;

}

</style>

</head>

<body>

<div class="gallery-header">

<h1>Our Gallery</h1>

<p>Explore Handmade String Art Collection</p>

<a href="index.html" class="back-btn">← Back to Home</a>

</div>

<div class="gallery-grid">

<img src="images/Artwork1.jpg" onclick="openImage(this.src)">

<img src="images/Artwork2.JPG" onclick="openImage(this.src)">

<img src="images/Artwork3.jpg" onclick="openImage(this.src)">

<img src="images/Artwork4.jpg" onclick="openImage(this.src)">

<img src="images/Artwork5.jpg" onclick="openImage(this.src)">

<img src="images/Artwork6.jpeg" onclick="openImage(this.src)">

<img src="images/Artwork7.jpg" onclick="openImage(this.src)">

<img src="images/Artwork8.jpg" onclick="openImage(this.src)">

<img src="images/Artwork9.jpg" onclick="openImage(this.src)">

<img src="images/Artwork10.jpg" onclick="openImage(this.src)">

<img src="images/Artwork11.jpg" onclick="openImage(this.src)">

<img src="images/Artwork12.jpg" onclick="openImage(this.src)">

<img src="images/Artwork13.jpg" onclick="openImage(this.src)">

<img src="images/Artwork14.jpg" onclick="openImage(this.src)">

<img src="images/Artwork15.jpg" onclick="openImage(this.src)">

<img src="images/Artwork16.jpeg" onclick="openImage(this.src)">

<img src="images/Artwork17.jpg" onclick="openImage(this.src)">

<img src="images/Artwork18.jpg" onclick="openImage(this.src)">

<img src="images/Artwork19.jpg" onclick="openImage(this.src)">

</div>

<div class="lightbox" id="lightbox">

<span class="close" onclick="closeImage()">&times;</span>

<img id="popup">

</div>

<script>

function openImage(img){

document.getElementById("lightbox").style.display="flex";

document.getElementById("popup").src=img;

}

function closeImage(){

document.getElementById("lightbox").style.display="none";

}

</script>

</body>
</html>
